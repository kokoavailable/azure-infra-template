name: Platform bootstrap CI

on:
  pull_request:
    paths:
      - "platform/**"
      - "stacks/_stack-template/**"
      - "scripts/bootstrap/**"
      - ".github/workflows/platform-bootstrap-ci.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    env:
      # Placeholders for `tofu validate` only (no Azure calls); stacks share provider variable shapes.
      TF_VAR_subscription_id: "00000000-0000-0000-0000-000000000001"
      TF_VAR_tenant_id: "00000000-0000-0000-0000-000000000002"
      TF_VAR_organization: "ci"
      TF_VAR_root_domain_name: "example.invalid"
      TF_VAR_github_organization: "example-org"
      TF_VAR_github_repository: "example-repo"
      TF_VAR_environment: "dev"
      TF_VAR_workload: "ci"
      TF_VAR_region_code: "krc"
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.11.6"
          tofu_wrapper: false

      - name: tofu fmt (check)
        run: tofu fmt -check -recursive

      - name: tofu validate (bootstrap stacks)
        run: |
          set -euo pipefail
          for d in \
            platform/connectivity/global/00-dns-public \
            platform/identity/02-identity-federation \
            platform/management/03-policy-governance \
            stacks/_stack-template
          do
            echo "==> $d"
            (cd "$d" && tofu init -backend=false -input=false && tofu validate)
          done

  # Proves GitHub Actions OIDC to Azure. Configure repo secrets first; run manually.
  oidc-azure-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify context
        run: az account show --output table
